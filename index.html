<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>今日锚 - AI 注意力重排助手</title>
  <meta name="description" content="新想法插入时，帮你重新分配今天的注意力">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app-container">
    <header id="header" class="topbar"></header>

    <main class="main-content" aria-label="注意力重排工作区">
      <div class="page-stack" id="page-stack">
        <section id="focus-screen" class="app-page focus-screen" aria-labelledby="focus-title"></section>
        <section id="today-queue" class="app-page queue-screen" aria-labelledby="queue-title"></section>
        <section id="reason-panel" class="app-page summary-screen" aria-labelledby="summary-title"></section>
      </div>
      <section id="capture-panel" aria-label="新增想法"></section>
    </main>
  </div>

  <div id="toast"></div>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
