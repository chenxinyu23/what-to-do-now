<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROTOTYPE - Minimal Today Queue</title>
  <style>
    /*
      PROTOTYPE - wipe me.
      Question: can the today queue page become more minimal, clearer in hierarchy,
      and mostly monochrome while preserving the fixed goal + add idea sheet model?
      Three variants are switchable via ?variant=A|B|C.
    */
    :root {
      --bg: #f6f6f4;
      --surface: #ffffff;
      --ink: #171717;
      --muted: #777777;
      --faint: #eeeeeb;
      --line: #deded9;
      --soft: #fafafa;
      --accent: #111111;
      --danger: #c94747;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea {
      font: inherit;
    }

    .prototype-note {
      max-width: 560px;
      margin: 16px auto 0;
      padding: 0 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .phone {
      width: min(100vw, 430px);
      min-height: 100vh;
      margin: 0 auto;
      background: var(--surface);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      position: relative;
      padding-bottom: 92px;
    }

    .top {
      position: sticky;
      top: 0;
      z-index: 4;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--faint);
    }

    .goal {
      padding: 14px 18px 12px;
      display: grid;
      gap: 5px;
    }

    .kicker {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .goal-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
    }

    .goal-title {
      margin: 0;
      font-size: 16px;
      line-height: 1.35;
      font-weight: 750;
    }

    .plain-btn {
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      padding: 0 11px;
      font-size: 12px;
      font-weight: 650;
    }

    .content {
      padding: 18px;
    }

    .page-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .page-title h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .section-title {
      margin: 22px 0 9px;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .task {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 13px 14px;
    }

    .task + .task {
      margin-top: 8px;
    }

    .task-main {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .rank {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid var(--line);
      color: var(--muted);
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      flex: 0 0 auto;
    }

    .task h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .reason {
      margin: 10px 0 0;
      color: #555;
      font-size: 13px;
      line-height: 1.55;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 999px;
      padding: 0 8px;
      background: var(--soft);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .pill.strong {
      background: var(--ink);
      color: #fff;
    }

    .pill.danger {
      background: #fff4f4;
      color: var(--danger);
    }

    .bottom-add {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      width: min(360px, calc(100vw - 32px));
      min-height: 46px;
      border: 0;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-weight: 760;
      box-shadow: var(--shadow);
      z-index: 5;
    }

    .switcher {
      position: fixed;
      left: 50%;
      bottom: 78px;
      transform: translateX(-50%);
      z-index: 20;
      display: grid;
      grid-template-columns: 38px minmax(130px, auto) 38px;
      align-items: center;
      border-radius: 999px;
      background: #151515;
      color: #fff;
      box-shadow: var(--shadow);
      overflow: hidden;
      font-size: 12px;
      font-weight: 700;
    }

    .switcher button {
      height: 38px;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 18px;
    }

    .switcher span {
      padding: 0 10px;
      white-space: nowrap;
    }

    .state {
      margin: 18px 0 0;
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 10px;
      color: var(--muted);
      font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
    }

    /* Variant A: quiet grouped cards */
    .variant-a .now-card {
      border: 1.5px solid var(--ink);
    }

    .variant-a .out .task {
      background: #fbfafa;
    }

    /* Variant B: editorial list, fewer boxes */
    .variant-b .content {
      padding-top: 22px;
    }

    .variant-b .board {
      border-top: 1px solid var(--line);
    }

    .variant-b .row-task {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 12px;
      padding: 15px 0;
      border-bottom: 1px solid var(--faint);
    }

    .variant-b .row-task h2 {
      margin: 0;
      font-size: 17px;
    }

    .variant-b .row-task p {
      margin: 7px 0 0;
      color: #555;
      font-size: 13px;
      line-height: 1.55;
    }

    .variant-b .lane-label {
      margin-top: 18px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
    }

    /* Variant C: compact command-center ledger */
    .variant-c .content {
      padding: 14px;
    }

    .variant-c .summary-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .variant-c .metric {
      padding: 10px;
      border-right: 1px solid var(--faint);
    }

    .variant-c .metric:last-child {
      border-right: 0;
    }

    .variant-c .metric strong {
      display: block;
      font-size: 18px;
    }

    .variant-c .metric span {
      color: var(--muted);
      font-size: 11px;
    }

    .variant-c .ledger {
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }

    .variant-c .ledger-row {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid var(--faint);
    }

    .variant-c .ledger-row:last-child {
      border-bottom: 0;
    }

    .variant-c .ledger-row h2 {
      margin: 0;
      font-size: 14px;
      line-height: 1.35;
    }

    .variant-c .ledger-row p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    @media (max-width: 460px) {
      .prototype-note { display: none; }
      .phone { border: 0; }
      .switcher { bottom: 76px; }
    }
  </style>
</head>
<body>
  <div class="prototype-note">
    PROTOTYPE - throwaway. Question: 极简风、信息层级清晰、除非功能必要尽量少用颜色。Use ?variant=A, B, or C.
  </div>
  <div id="app"></div>

  <script>
    const variants = {
      A: "Quiet groups",
      B: "Line-first flow",
      C: "Compact ledger"
    };

    const state = {
      goal: "完成项目 Demo 提交",
      tasks: [
        {
          rank: 1,
          title: "搭建 Demo 首页",
          lane: "now",
          deadline: "今天下午",
          intent: "立即做",
          reason: "今天核心任务，直接影响 Demo 展示效果。",
          score: 4.0
        },
        {
          rank: 2,
          title: "代码审查",
          lane: "later",
          deadline: "今天晚上",
          intent: "稍后处理",
          reason: "保证代码质量，建议在 Demo 完成后进行。",
          score: 3.4
        },
        {
          rank: 3,
          title: "查竞品资料",
          lane: "later",
          deadline: "明天",
          intent: "稍后处理",
          reason: "有助于了解市场情况，但不应挤占当前高优先级任务。",
          score: 2.6
        },
        {
          rank: "-",
          title: "整理项目说明文档",
          lane: "out",
          deadline: "本周内",
          intent: "不放今天",
          reason: "重要但不紧急，今天处理会挤占 Demo 交付时间。",
          score: 2.5
        }
      ]
    };

    function getVariant() {
      const params = new URLSearchParams(window.location.search);
      const key = (params.get("variant") || "A").toUpperCase();
      return variants[key] ? key : "A";
    }

    function setVariant(next) {
      const url = new URL(window.location.href);
      url.searchParams.set("variant", next);
      window.history.replaceState({}, "", url);
      render();
    }

    function cycle(delta) {
      const keys = Object.keys(variants);
      const index = keys.indexOf(getVariant());
      setVariant(keys[(index + delta + keys.length) % keys.length]);
    }

    function taskCard(task, strong = false) {
      return `
        <article class="task ${strong ? "now-card" : ""}">
          <div class="task-main">
            <div class="rank">${task.rank}</div>
            <div>
              <h2>${task.title}</h2>
              <div class="meta">
                <span>${task.deadline}</span>
                <span class="pill ${task.lane === "now" ? "strong" : task.lane === "out" ? "danger" : ""}">${task.intent}</span>
              </div>
              <p class="reason">${task.reason}</p>
            </div>
          </div>
        </article>
      `;
    }

    function topBar(extra = "") {
      return `
        <header class="top">
          <div class="goal">
            <span class="kicker">今日目标</span>
            <div class="goal-row">
              <p class="goal-title">${state.goal}</p>
              <button class="plain-btn">编辑</button>
            </div>
            ${extra}
          </div>
        </header>
      `;
    }

    function VariantA() {
      const now = state.tasks.filter((task) => task.lane === "now");
      const later = state.tasks.filter((task) => task.lane === "later");
      const out = state.tasks.filter((task) => task.lane === "out");
      return `
        <main class="phone variant-a">
          ${topBar()}
          <section class="content">
            <div class="page-title">
              <h1>今天怎么排</h1>
              <span class="count">共 ${state.tasks.length} 项</span>
            </div>
            <div class="section-title"><span>现在做</span><span>${now.length}</span></div>
            ${now.map((task) => taskCard(task, true)).join("")}
            <div class="section-title"><span>晚点做</span><span>${later.length}</span></div>
            ${later.map((task) => taskCard(task)).join("")}
            <div class="section-title out"><span>不放今天</span><span>${out.length}</span></div>
            <div class="out">${out.map((task) => taskCard(task)).join("")}</div>
            ${stateBlock("A keeps the current grouped-card model but removes most colour. Strongest hierarchy comes from section order + border weight.")}
          </section>
          ${bottomAdd()}
        </main>
      `;
    }

    function VariantB() {
      const lanes = [
        ["now", "现在只看这一件"],
        ["later", "今天晚点再处理"],
        ["out", "先不放进今天"]
      ];
      return `
        <main class="phone variant-b">
          ${topBar(`<span class="kicker">当前安排：1 件现在做，2 件晚点，1 件移出</span>`)}
          <section class="content">
            <div class="page-title">
              <h1>安排今天</h1>
              <span class="count">极简列表</span>
            </div>
            <div class="board">
              ${lanes.map(([lane, label]) => `
                <div class="lane-label">${label}</div>
                ${state.tasks.filter((task) => task.lane === lane).map((task) => `
                  <article class="row-task">
                    <div class="rank">${task.rank}</div>
                    <div>
                      <h2>${task.title}</h2>
                      <div class="meta"><span>${task.deadline}</span><span>${task.intent}</span><span>${task.score.toFixed(1)}</span></div>
                      <p>${task.reason}</p>
                    </div>
                  </article>
                `).join("")}
              `).join("")}
            </div>
            ${stateBlock("B removes cards almost entirely. It reads like an editorial plan: best when the page should feel calm and decision-first.")}
          </section>
          ${bottomAdd()}
        </main>
      `;
    }

    function VariantC() {
      return `
        <main class="phone variant-c">
          ${topBar()}
          <section class="content">
            <div class="page-title">
              <h1>今日队列</h1>
              <span class="count">紧凑模式</span>
            </div>
            <div class="summary-strip">
              <div class="metric"><strong>1</strong><span>现在做</span></div>
              <div class="metric"><strong>2</strong><span>晚点做</span></div>
              <div class="metric"><strong>1</strong><span>不放今天</span></div>
            </div>
            <div class="ledger">
              ${state.tasks.map((task) => `
                <article class="ledger-row">
                  <div class="rank">${task.rank}</div>
                  <div>
                    <h2>${task.title}</h2>
                    <p>${task.deadline} · ${task.reason}</p>
                  </div>
                  <span class="pill ${task.lane === "now" ? "strong" : task.lane === "out" ? "danger" : ""}">${task.intent}</span>
                </article>
              `).join("")}
            </div>
            ${stateBlock("C optimizes density. It is fastest to scan, but gives less emotional emphasis to the current focus task.")}
          </section>
          ${bottomAdd()}
        </main>
      `;
    }

    function stateBlock(note) {
      return `<pre class="state">variant: ${getVariant()} — ${variants[getVariant()]}
goal: ${state.goal}
visible model: ${note}</pre>`;
    }

    function bottomAdd() {
      return `<button class="bottom-add">+ 新增想法</button>`;
    }

    function switcher() {
      const current = getVariant();
      return `
        <div class="switcher" aria-label="Prototype variants">
          <button type="button" data-prev>‹</button>
          <span>${current} — ${variants[current]}</span>
          <button type="button" data-next>›</button>
        </div>
      `;
    }

    function render() {
      const current = getVariant();
      const views = { A: VariantA, B: VariantB, C: VariantC };
      document.getElementById("app").innerHTML = views[current]() + switcher();
      document.querySelector("[data-prev]").onclick = () => cycle(-1);
      document.querySelector("[data-next]").onclick = () => cycle(1);
    }

    window.addEventListener("keydown", (event) => {
      const target = event.target;
      const isTyping = target && (target.matches("input, textarea") || target.isContentEditable);
      if (isTyping) return;
      if (event.key === "ArrowLeft") cycle(-1);
      if (event.key === "ArrowRight") cycle(1);
    });

    render();
  </script>
</body>
</html>
