<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">现在做什么？产品界面预览</title>
  <description id="description">展示现在做什么？的当前任务、今日队列和注意力模式。</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f2ec"/>
      <stop offset="1" stop-color="#e8e3fb"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#29223f" flood-opacity="0.18"/>
    </filter>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#181915" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#background)"/>
  <circle cx="1260" cy="120" r="220" fill="#9688e3" opacity="0.13"/>
  <circle cx="130" cy="760" r="270" fill="#dff15a" opacity="0.18"/>

  <g transform="translate(105 110)">
    <text x="0" y="0" fill="#5d51a6" font-family="Arial, PingFang SC, sans-serif" font-size="22" font-weight="700" letter-spacing="3">AI ATTENTION REORDER ASSISTANT</text>
    <text x="0" y="78" fill="#2f295a" font-family="Arial, PingFang SC, sans-serif" font-size="68" font-weight="800">现在做什么？</text>
    <text x="0" y="132" fill="#181915" font-family="Arial, PingFang SC, sans-serif" font-size="30" font-weight="600">新想法插入时，重新决定先做什么</text>
    <text x="0" y="184" fill="#707268" font-family="Arial, PingFang SC, sans-serif" font-size="21">模型理解任务 · 本地规则排序 · 无模型也能体验</text>

    <g transform="translate(0 248)">
      <rect width="405" height="74" rx="37" fill="#181915"/>
      <text x="36" y="47" fill="#ffffff" font-family="Arial, PingFang SC, sans-serif" font-size="22" font-weight="700">捕获想法 → 拆解任务 → 重排队列</text>
    </g>

    <g transform="translate(0 362)" font-family="Arial, PingFang SC, sans-serif">
      <g>
        <circle cx="18" cy="18" r="18" fill="#9688e3"/>
        <path d="M10 18l5 5 11-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="52" y="26" fill="#181915" font-size="22" font-weight="600">围绕今日目标进行动态排序</text>
      </g>
      <g transform="translate(0 64)">
        <circle cx="18" cy="18" r="18" fill="#9688e3"/>
        <path d="M10 18l5 5 11-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="52" y="26" fill="#181915" font-size="22" font-weight="600">解释为什么现在应该先做这件事</text>
      </g>
      <g transform="translate(0 128)">
        <circle cx="18" cy="18" r="18" fill="#9688e3"/>
        <path d="M10 18l5 5 11-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="52" y="26" fill="#181915" font-size="22" font-weight="600">支持手动约束与多种注意力模式</text>
      </g>
    </g>
  </g>

  <g transform="translate(790 62)" filter="url(#shadow)">
    <rect width="455" height="776" rx="48" fill="#181915"/>
    <rect x="10" y="10" width="435" height="756" rx="40" fill="#f3f2ec"/>
    <rect x="169" y="24" width="118" height="22" rx="11" fill="#181915"/>

    <g transform="translate(38 82)" font-family="Arial, PingFang SC, sans-serif">
      <text x="0" y="0" fill="#181915" font-size="24" font-weight="800">现在做什么？</text>
      <text x="0" y="34" fill="#707268" font-size="15">选择你的注意力模式</text>
      <g transform="translate(0 53)">
        <rect width="76" height="34" rx="17" fill="#9688e3"/>
        <text x="22" y="23" fill="#fff" font-size="14" font-weight="700">平衡</text>
        <rect x="86" width="76" height="34" rx="17" fill="#ffffff"/>
        <text x="108" y="23" fill="#707268" font-size="14">截止</text>
        <rect x="172" width="76" height="34" rx="17" fill="#ffffff"/>
        <text x="194" y="23" fill="#707268" font-size="14">目标</text>
      </g>

      <g transform="translate(0 132)">
        <text x="0" y="0" fill="#5d51a6" font-size="14" font-weight="700">● 现在要做：</text>
        <text x="0" y="55" fill="#181915" font-size="35" font-weight="800">搭建 Demo 首页</text>
        <text x="0" y="88" fill="#707268" font-size="16">今天核心任务，直接影响 Demo 展示效果。</text>
        <g transform="translate(0 112)">
          <rect width="132" height="38" rx="19" fill="#9688e3"/>
          <text x="31" y="25" fill="#fff" font-size="15" font-weight="700">标记完成</text>
        </g>
      </g>

      <g transform="translate(0 328)">
        <text x="0" y="0" fill="#181915" font-size="23" font-weight="800">今天晚点做</text>
        <text x="350" y="0" fill="#707268" font-size="14">2 项</text>

        <g transform="translate(0 24)" filter="url(#card-shadow)">
          <rect width="379" height="104" rx="22" fill="#ffffff"/>
          <rect x="0" width="8" height="104" rx="4" fill="#9688e3"/>
          <text x="26" y="38" fill="#181915" font-size="19" font-weight="700">代码审查</text>
          <text x="26" y="68" fill="#707268" font-size="14">保证代码质量，建议在 Demo 完成后进行。</text>
          <rect x="287" y="20" width="70" height="27" rx="14" fill="#f0edff"/>
          <text x="305" y="39" fill="#5d51a6" font-size="12" font-weight="700">今晚截止</text>
        </g>

        <g transform="translate(0 140)" filter="url(#card-shadow)">
          <rect width="379" height="104" rx="22" fill="#ffffff"/>
          <rect x="0" width="8" height="104" rx="4" fill="#d7eadc"/>
          <text x="26" y="38" fill="#181915" font-size="19" font-weight="700">查竞品资料</text>
          <text x="26" y="68" fill="#707268" font-size="14">有价值，但不应挤占当前高优先级任务。</text>
          <rect x="300" y="20" width="57" height="27" rx="14" fill="#f4f3ee"/>
          <text x="316" y="39" fill="#707268" font-size="12" font-weight="700">明天</text>
        </g>
      </g>

      <g transform="translate(0 620)">
        <rect width="379" height="72" rx="22" fill="#181915"/>
        <text x="32" y="45" fill="#fff" font-size="19" font-weight="700">＋ 新增想法并重新安排</text>
      </g>
    </g>
  </g>
</svg>
